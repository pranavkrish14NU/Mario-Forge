<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Mario-Forge — Integration Spike</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; color: #fff; height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: monospace;
    }
    canvas#game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 768px; height: 416px;
      background: #5cd;
      outline: 1px solid #333;
    }
    .hud { margin-top: 8px; color: #aaa; font-size: 12px; }
    .hud b { color: #fff; }
  </style>
</head>
<body>
  <canvas id="game" width="512" height="208" aria-label="Mario-Forge game canvas"></canvas>
  <div class="hud">
    <b>Arrow / WASD</b> move &nbsp;|&nbsp; <b>Shift</b> run &nbsp;|&nbsp; <b>Space</b> jump &nbsp;|&nbsp; <b>P</b> pause &nbsp;|&nbsp; <b>Enter</b> start
  </div>

  <script src="src/state-manager.js"></script>
  <script src="src/scenes.js"></script>
  <script src="src/input.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/collision.js"></script>
  <script src="src/player.js"></script>
  <script src="src/tilemap.js"></script>
  <script src="src/game.js"></script>
  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      // --- module wiring ---
      const input = window.InputModule.createInput({});
      const collision = window.CollisionModule.createCollision({ tileSize: 16 });
      const tilemap = window.TilemapModule.createTilemap({ tileSize: 16 });
      const player = window.PlayerModule.createPlayer({ x: 32, y: 100 });
      const playerCtl = window.PlayerModule.createPlayerController({ input: input });

      // Light gravity used inside the playing scene (the standalone Physics
      // module is unit-tested separately; the integration spike uses a tiny
      // inline integrator so the per-axis Collision contract is unambiguous).
      const GRAVITY = 0.5;
      const TERMINAL_VY = 8;

      // --- state machine ---
      const stateManager = window.StateManagerFactory.createStateManager({
        allowedTransitions: window.Scenes.DEFAULT_TRANSITIONS,
      });
      const placeholders = window.Scenes.createPlaceholderScenes({
        width: canvas.width,
        height: canvas.height,
      });

      const playingScene = {
        enter: function () {
          console.log('[Scene] enter: playing');
          player.x = 32; player.y = 100;
          player.vx = 0; player.vy = 0;
          player.onGround = false;
        },
        exit: function () { console.log('[Scene] exit: playing'); },
        update: function () {
          playerCtl.update(player);
          player.vy += GRAVITY;
          if (player.vy > TERMINAL_VY) player.vy = TERMINAL_VY;
          collision.step(player, tilemap.tileAt, {
            onLand: function () { /* sound stub */ },
            onWall: function () { /* sound stub */ },
          });
          // Falling off the map — placeholder for death/respawn (WO-017).
          if (player.y > tilemap.pixelHeight) {
            player.x = 32; player.y = 100;
            player.vx = 0; player.vy = 0;
            player.lives = Math.max(0, player.lives - 1);
          }
        },
        render: function (ctx) {
          ctx.fillStyle = '#5cd';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          tilemap.draw(ctx);
          window.PlayerModule.drawPlayer(ctx, player);
          ctx.fillStyle = '#fff';
          if ('font' in ctx) ctx.font = '10px monospace';
          ctx.fillText('LIVES: ' + player.lives + '  SCORE: ' + player.score, 4, 12);
        },
      };

      stateManager.registerScene('title', placeholders.title);
      stateManager.registerScene('playing', playingScene);
      stateManager.registerScene('paused', placeholders.paused);
      stateManager.registerScene('gameOver', placeholders.gameOver);
      stateManager.registerScene('victory', placeholders.victory);
      stateManager.registerScene('levelTransition', placeholders.levelTransition);

      stateManager.changeScene('title');

      // Custom loop: ordering matters — scene reads input, then input.update()
      // rolls off justPressed/justReleased so the next frame sees a clean slate.
      var lastTime = 0;
      function frame(t) {
        var dt = lastTime ? (t - lastTime) / 1000 : 0;
        lastTime = t;
        stateManager.update(dt);
        stateManager.render(ctx);
        input.update();
        requestAnimationFrame(frame);
      }

      // Top-level menu transitions (scene-level input handling isn't
      // formalized in this spike — the Input module handles in-game keys).
      window.addEventListener('keydown', function (e) {
        var cur = stateManager.getCurrentSceneName();
        if (e.key === 'Enter') {
          if (cur === 'title') stateManager.changeScene('playing');
          else if (cur === 'gameOver' || cur === 'victory') stateManager.changeScene('title');
        }
        if (e.key === 'p' || e.key === 'P') {
          if (cur === 'playing') stateManager.changeScene('paused');
          else if (cur === 'paused') stateManager.changeScene('playing');
        }
      });

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
