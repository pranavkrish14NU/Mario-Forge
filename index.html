<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Mario-Forge — Integration Spike</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; color: #fff; height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: monospace;
    }
    /* Sized at runtime by ViewportModule (WO-020). The CSS image-rendering
       declarations stay here so the property is set BEFORE the first paint
       and is never overwritten by intermediate JS. The body's black
       background provides the letterbox / pillarbox bars around the
       aspect-ratio-preserving display rect. */
    canvas#game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #5cd;
      outline: 1px solid #333;
      /* Fallback size if JS scaling is unavailable — keeps the game playable
         without ViewportModule. */
      width: 768px; height: 416px;
    }
    .hud { margin-top: 8px; color: #aaa; font-size: 12px; }
    .hud b { color: #fff; }
  </style>
</head>
<body>
  <canvas id="game" width="512" height="208" aria-label="Mario-Forge game canvas"></canvas>
  <div class="hud">
    <b>Arrow / WASD</b> move &nbsp;|&nbsp; <b>Shift</b> run &nbsp;|&nbsp; <b>Space</b> jump &nbsp;|&nbsp; <b>P</b> pause &nbsp;|&nbsp; <b>Enter</b> start
  </div>

  <script src="src/state-manager.js"></script>
  <script src="src/scenes.js"></script>
  <script src="src/input.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/collision.js"></script>
  <script src="src/player.js"></script>
  <script src="src/tilemap.js"></script>
  <script src="src/camera.js"></script>
  <script src="src/enemy.js"></script>
  <script src="src/items.js"></script>
  <script src="src/hazards.js"></script>
  <script src="src/combat.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/screens.js"></script>
  <script src="src/viewport.js"></script>
  <script src="src/game.js"></script>
  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      // Responsive canvas scaling (WO-020). Attach BEFORE any other module
      // so the first paint already has the correct display size on mobile.
      // The viewport overrides the CSS-fallback width/height and re-runs on
      // every resize / orientationchange.
      const viewport = window.ViewportModule.createViewport({
        canvas: canvas,
        internalWidth: canvas.width,
        internalHeight: canvas.height,
        preferInteger: true,
      });

      // --- module wiring ---
      const input = window.InputModule.createInput({});
      const collision = window.CollisionModule.createCollision({ tileSize: 16 });
      const player = window.PlayerModule.createPlayer({ x: 32, y: 100 });
      const playerCtl = window.PlayerModule.createPlayerController({ input: input });
      const combat = window.CombatModule.createCombat({});

      // World refs — re-built on level change. Wrapped in a single mutable
      // container so the playing scene closure always reads the current set.
      const world = {
        tilemap: null,
        camera: null,
        enemies: null,
        items: null,
        hazards: null,
        renderer: null,
        combinedTileAt: null,
      };

      function setupWorld(mapRows) {
        world.tilemap = window.TilemapModule.createTilemap({ tileSize: 16, map: mapRows });
        world.camera = window.CameraModule.createCamera({
          viewport: { width: canvas.width, height: canvas.height },
          level: { pixelWidth: world.tilemap.pixelWidth, pixelHeight: world.tilemap.pixelHeight },
          initial: { x: 0, y: 0 },
        });
        world.enemies = window.EnemyModule.createEnemyPool({ tilemap: world.tilemap });
        world.enemies.spawnAllFromTilemap(world.tilemap);
        world.items = window.ItemsModule.createItems({ tileSize: 16 });
        world.items.spawnAllFromTilemap(world.tilemap);
        world.hazards = window.HazardsModule.createHazards({ tileSize: 16 });
        world.hazards.spawnAllFromTilemap(world.tilemap);
        world.combinedTileAt = world.items.combineTileQuery(world.tilemap);
        world.renderer = window.RendererModule.createRenderer({
          ctx: ctx,
          viewport: { width: canvas.width, height: canvas.height },
          camera: world.camera,
          tilemap: world.tilemap,
          backgrounds: [
            { factor: 0, color: '#5cd' },
            { factor: 0.3, draw: function (c, off) {
              c.fillStyle = '#7a8';
              for (var i = -1; i < 9; i++) {
                var cx = i * 64 - (off.x % 64);
                c.fillRect(cx, canvas.height - 80, 64, 40);
              }
            } },
            { factor: 0.6, draw: function (c, off) {
              c.fillStyle = '#5a7';
              for (var i = -1; i < 9; i++) {
                var cx = i * 96 - (off.x % 96);
                c.fillRect(cx, canvas.height - 56, 96, 24);
              }
            } },
          ],
        });
      }

      // Convenience aliases that just deref the live world.
      function tilemap() { return world.tilemap; }
      function camera() { return world.camera; }
      function enemies() { return world.enemies; }
      function items() { return world.items; }
      function hazards() { return world.hazards; }
      function renderer() { return world.renderer; }
      // Two parallax background layers stacked behind the foreground.
      const skyBlue = '#5cd';
      const renderer = window.RendererModule.createRenderer({
        ctx: ctx,
        viewport: { width: canvas.width, height: canvas.height },
        camera: camera,
        tilemap: tilemap,
        backgrounds: [
          // Locked sky.
          { factor: 0, color: skyBlue },
          // Distant hills (factor 0.3) — scrolls slowly.
          {
            factor: 0.3,
            draw: function (c, off) {
              c.fillStyle = '#7a8';
              for (var i = -1; i < 9; i++) {
                var cx = i * 64 - (off.x % 64);
                c.beginPath && c.beginPath();
                c.fillRect(cx, canvas.height - 80, 64, 40);
              }
            },
          },
          // Mid-ground hills (factor 0.6) — scrolls faster.
          {
            factor: 0.6,
            draw: function (c, off) {
              c.fillStyle = '#5a7';
              for (var i = -1; i < 9; i++) {
                var cx = i * 96 - (off.x % 96);
                c.fillRect(cx, canvas.height - 56, 96, 24);
              }
            },
          },
        ],
      });

      // Light gravity used inside the playing scene (the standalone Physics
      // module is unit-tested separately; the integration spike uses a tiny
      // inline integrator so the per-axis Collision contract is unambiguous).
      const GRAVITY = 0.5;
      const TERMINAL_VY = 8;

      // --- state machine ---
      const stateManager = window.StateManagerFactory.createStateManager({
        allowedTransitions: window.Scenes.DEFAULT_TRANSITIONS,
      });
      const placeholders = window.Scenes.createPlaceholderScenes({
        width: canvas.width,
        height: canvas.height,
      });

      const playingScene = {
        enter: function () {
          console.log('[Scene] enter: playing');
          // Snap camera to the player's current location (set by setupWorld
          // or resetGameWorld). Avoids the lerp jump on level entry.
          camera().snapTo({ x: player.x, y: player.y, width: player.w, height: player.h });
        },
        exit: function () { console.log('[Scene] exit: playing'); },
        update: function () {
          playerCtl.update(player);
          player.vy += GRAVITY;
          if (player.vy > TERMINAL_VY) player.vy = TERMINAL_VY;
          collision.step(player, world.combinedTileAt, {
            onLand: function () {},
            onWall: function () {},
            onCeiling: function (entity, info) { items().onCeilingHit(entity, info); },
          });
          camera().update({
            x: player.x, y: player.y, width: player.w, height: player.h,
            onGround: player.onGround,
          });
          enemies().update({
            cameraOffset: camera().getOffset(),
            viewport: { width: canvas.width, height: canvas.height },
          });
          items().update({ player: player });
          hazards().update({ player: player });
          combat.update({
            player: player,
            pool: enemies(),
            items: items(),
            hazards: hazards(),
            tilemap: tilemap(),
            level: { pixelHeight: tilemap().pixelHeight },
            stateManager: stateManager,
            respawn: function (p) {
              const spawn = levelManager.getSpawnPosition();
              p.x = spawn.x; p.y = spawn.y;
              p.vx = 0; p.vy = 0;
            },
          });
          // Goal contact triggers level transition.
          if (levelManager.goalContact(player, tilemap()) && !levelManager.isTransitioning()) {
            levelManager.reachGoal();
            stateManager.changeScene('levelTransition');
          }
        },
        render: function () {
          renderer().render({
            player: player.visible === false ? null : player,
            entities: enemies().getActive()
              .concat(items().getActive())
              .concat(hazards().getActive()),
            hud: {
              score: player.score,
              lives: player.lives,
              levelName: levelManager.currentLevel().name,
            },
          });
        },
      };

      input.remap('r', 'restart');
      input.remap('R', 'restart');

      // Game-state holder. startTimeMs accumulates total play time across
      // levels (timer keeps ticking through transitions).
      const gameState = { startTimeMs: 0, score: 0 };

      const levelManager = window.LevelsModule.createLevelManager({
        tileSize: 16,
        onLoadLevel: function (level /*, idx */) {
          setupWorld(level.map);
          const spawn = levelManager.getSpawnPosition();
          player.x = spawn.x; player.y = spawn.y;
          player.vx = 0; player.vy = 0;
          player.onGround = false;
          player.powered = false; player.w = 16; player.h = 16; player.visible = true;
          combat.reset();
        },
        onVictory: function () { stateManager.changeScene('victory'); },
      });

      function resetGameWorld() {
        levelManager.reset(); // re-loads level 0 via onLoadLevel
        player.lives = 3;
        player.score = 0;
        gameState.startTimeMs = Date.now();
      }
      // Initial world build before any state transition.
      setupWorld(levelManager.currentLevel().map);
      const initialSpawn = levelManager.getSpawnPosition();
      player.x = initialSpawn.x; player.y = initialSpawn.y;

      // WO-015 screens — replace the placeholder scenes from WO-002.
      const titleScene = window.ScreensModule.createTitleScreen({
        width: canvas.width, height: canvas.height,
        input: input,
        transitions: { onStart: function () { resetGameWorld(); stateManager.changeScene('playing'); } },
      });
      const pauseScene = window.ScreensModule.createPauseScreen({
        width: canvas.width, height: canvas.height,
        input: input,
        getUnderlay: function () { return playingScene; },
        transitions: {
          onResume: function () { stateManager.changeScene('playing'); },
          onRestart: function () { resetGameWorld(); stateManager.changeScene('title'); },
        },
      });
      const gameOverScene = window.ScreensModule.createGameOverScreen({
        width: canvas.width, height: canvas.height,
        input: input,
        getScore: function () { return player.score; },
        transitions: { onRestart: function () { resetGameWorld(); stateManager.changeScene('title'); } },
      });
      const victoryScene = window.ScreensModule.createVictoryScreen({
        width: canvas.width, height: canvas.height,
        input: input,
        getScore: function () { return player.score; },
        getTime: function () { return (Date.now() - gameState.startTimeMs) / 1000; },
        transitions: { onRestart: function () { resetGameWorld(); stateManager.changeScene('title'); } },
      });

      const levelTransitionScene = window.ScreensModule.createLevelTransitionScreen({
        width: canvas.width, height: canvas.height,
        durationFrames: 120,
        getLevelIndex: function () {
          // Index AFTER the upcoming advance — the title we'll show is the next level.
          return Math.min(levelManager.currentIndex() + 1, levelManager.totalLevels() - 1);
        },
        getLevelName: function () {
          return levelManager.nextLevelName() || levelManager.currentLevel().name;
        },
        transitions: {
          onComplete: function () {
            levelManager.completeTransition();
            // If we completed into victory, onVictory in the manager already
            // switched scenes. Otherwise drop back into playing.
            if (stateManager.getCurrentSceneName() === 'levelTransition') {
              stateManager.changeScene('playing');
            }
          },
        },
      });

      stateManager.registerScene('title', titleScene);
      stateManager.registerScene('playing', playingScene);
      stateManager.registerScene('paused', pauseScene);
      stateManager.registerScene('gameOver', gameOverScene);
      stateManager.registerScene('victory', victoryScene);
      stateManager.registerScene('levelTransition', levelTransitionScene);

      stateManager.changeScene('title');

      var lastTime = 0;
      function frame(t) {
        var dt = lastTime ? (t - lastTime) / 1000 : 0;
        lastTime = t;
        stateManager.update(dt);
        stateManager.render(ctx);
        input.update();
        requestAnimationFrame(frame);
      }

      // Top-level pause toggle — P always switches between playing/paused.
      window.addEventListener('keydown', function (e) {
        var cur = stateManager.getCurrentSceneName();
        if (e.key === 'p' || e.key === 'P') {
          if (cur === 'playing') stateManager.changeScene('paused');
          else if (cur === 'paused') stateManager.changeScene('playing');
        }
      });

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
